<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Patente Parole — Learn the words that pass the exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EFE9;
  --ink:#191B20;
  --ink-soft:#5C5F66;
  --blue:#0A57A5;
  --blue-dark:#08427D;
  --red:#CC2431;
  --red-dark:#A11B26;
  --green:#017C4E;
  --green-dark:#01603D;
  --yellow:#F4B912;
  --asphalt:#33343A;
  --asphalt-dark:#26272C;
  --card:#FFFFFF;
  --shadow:0 2px 0 rgba(25,27,32,.14);
  --radius:16px;
  --disp:'Archivo',system-ui,sans-serif;
  --body:'Public Sans',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--body);
  background:var(--bg);
  color:var(--ink);
  overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

/* ============ HEADER ============ */
header{
  position:sticky;top:0;z-index:50;
  background:var(--bg);
  border-bottom:2px solid rgba(25,27,32,.08);
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
  max-width:560px;margin:0 auto;width:100%;
}
.brand{font-family:var(--disp);font-weight:900;font-size:17px;letter-spacing:-.02em}
.brand span{color:var(--blue)}
.stats{display:flex;gap:14px;align-items:center}
.stat{display:flex;align-items:center;gap:5px;font-family:var(--disp);font-weight:700;font-size:15px}
.stat svg{width:20px;height:20px}
.stat.streak{color:#E2560E}
.stat.xp{color:var(--blue)}

/* ============ ROAD MAP ============ */
#screen-map{max-width:560px;margin:0 auto;padding-bottom:80px}
.map-intro{padding:22px 20px 8px}
.map-intro h1{
  font-family:var(--disp);font-weight:900;font-size:26px;line-height:1.1;
  letter-spacing:-.02em;
}
.map-intro p{color:var(--ink-soft);margin-top:6px;font-size:14.5px;line-height:1.45}

.road-wrap{position:relative;margin-top:18px}
.road{
  position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:74px;background:var(--asphalt);
  border-left:5px solid #C9C6BC;border-right:5px solid #C9C6BC;
}
.road::before{
  content:"";position:absolute;top:0;bottom:0;left:50%;width:6px;
  transform:translateX(-50%);
  background:repeating-linear-gradient(to bottom,#F1EFE9 0 26px,transparent 26px 54px);
}
.units{position:relative;display:flex;flex-direction:column;gap:34px;padding:26px 0 40px}
.unit-row{display:flex;align-items:center;justify-content:center;position:relative}
.unit-node{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  width:150px;position:relative;z-index:2;
  transition:transform .12s ease;
}
.unit-node:active{transform:scale(.96)}
.unit-row:nth-child(odd) .unit-node{margin-right:190px}
.unit-row:nth-child(even) .unit-node{margin-left:190px}
@media(max-width:430px){
  .unit-row:nth-child(odd) .unit-node{margin-right:150px}
  .unit-row:nth-child(even) .unit-node{margin-left:150px}
}

/* road-sign shaped badges */
.sign{
  width:84px;height:84px;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:900;font-size:26px;color:#fff;
  position:relative;filter:drop-shadow(0 3px 0 rgba(25,27,32,.22));
}
.sign.circle{border-radius:50%;background:#fff;border:11px solid var(--red);color:var(--ink)}
.sign.circle-blue{border-radius:50%;background:var(--blue)}
.sign.square{border-radius:12px;background:var(--blue)}
.sign.triangle{width:92px;height:84px;background:none;color:var(--ink)}
.sign.triangle::before{
  content:"";position:absolute;inset:0;
  background:var(--red);
  clip-path:polygon(50% 0,100% 100%,0 100%);
}
.sign.triangle::after{
  content:"";position:absolute;left:11px;right:11px;top:11px;bottom:7px;
  background:#fff;
  clip-path:polygon(50% 0,100% 100%,0 100%);
}
.sign.triangle .glyph{position:relative;z-index:1;margin-top:16px}
.sign.green{border-radius:12px;background:var(--green)}
.sign.done::after{content:none}
.sign .glyph{line-height:1}

.unit-label{
  background:var(--card);border-radius:12px;padding:7px 12px;text-align:center;
  box-shadow:var(--shadow);border:1.5px solid rgba(25,27,32,.1);
  min-width:132px;
}
.unit-label b{display:block;font-family:var(--disp);font-weight:700;font-size:13.5px;letter-spacing:-.01em}
.unit-label small{color:var(--ink-soft);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.unit-bar{height:6px;border-radius:3px;background:rgba(25,27,32,.1);margin-top:6px;overflow:hidden}
.unit-bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .4s ease}
.unit-node.locked{opacity:.45;pointer-events:none}
.unit-node.locked .sign{filter:grayscale(1) drop-shadow(0 3px 0 rgba(25,27,32,.18))}

/* ============ UNIT MODAL ============ */
.overlay{
  position:fixed;inset:0;z-index:90;background:rgba(25,27,32,.5);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  background:var(--bg);width:100%;max-width:560px;
  border-radius:22px 22px 0 0;padding:22px 20px 26px;
  max-height:82vh;overflow-y:auto;
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;gap:14px;align-items:center}
.sheet-head .sign{width:60px;height:60px;font-size:19px;flex:none}
.sheet-head .sign.triangle{width:66px;height:60px}
.sheet-head .sign.circle{border-width:8px}
.sheet-head h2{font-family:var(--disp);font-weight:900;font-size:21px;letter-spacing:-.02em}
.sheet-head p{color:var(--ink-soft);font-size:13.5px;margin-top:2px}
.word-grid{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px}
.chip{
  background:var(--card);border:1.5px solid rgba(25,27,32,.12);border-radius:10px;
  padding:6px 10px;font-size:13px;font-weight:600;box-shadow:0 1.5px 0 rgba(25,27,32,.1);
}
.chip i{font-style:normal;color:var(--ink-soft);font-weight:400}
.chip.s0{border-color:rgba(25,27,32,.12)}
.chip.s1{border-color:var(--yellow)}
.chip.s2{border-color:var(--green);background:#EAF5EF}
.btn{
  display:block;width:100%;text-align:center;
  font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.01em;
  padding:15px;border-radius:14px;margin-top:14px;
  transition:transform .08s ease;
}
.btn:active{transform:translateY(2px)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-dark)}
.btn-ghost{background:transparent;color:var(--ink-soft);box-shadow:none;padding:10px}

/* ============ LESSON ============ */
#screen-lesson{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.lesson-top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lesson-top .close{font-size:22px;color:var(--ink-soft);font-weight:700;padding:4px 8px}
.progress{flex:1;height:14px;background:rgba(25,27,32,.12);border-radius:7px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--green);border-radius:7px;transition:width .35s ease}
.hearts{display:flex;gap:3px;font-size:17px}
.hearts .off{opacity:.22;filter:grayscale(1)}

.ex-area{flex:1;padding:8px 20px 20px;display:flex;flex-direction:column}
.ex-kind{
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink-soft);margin:8px 0 10px;
}
.prompt-sign{
  align-self:center;margin:10px 0 6px;text-align:center;
  background:var(--blue);color:#fff;border-radius:14px;
  padding:22px 26px;min-width:210px;max-width:100%;
  font-family:var(--disp);font-weight:900;font-size:30px;letter-spacing:-.01em;line-height:1.1;
  box-shadow:0 4px 0 var(--blue-dark);
  border:3px solid #fff;outline:3px solid var(--blue);
}
.prompt-sign small{
  display:block;font-family:var(--body);font-weight:600;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-top:8px;
}
.prompt-en{
  align-self:center;margin:10px 0 6px;text-align:center;
  font-family:var(--disp);font-weight:900;font-size:24px;line-height:1.2;
  padding:10px 6px;
}
.sentence-card{
  background:var(--card);border:1.5px solid rgba(25,27,32,.12);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;margin:8px 0 4px;
}
.sentence-card .it{font-family:var(--disp);font-weight:700;font-size:17.5px;line-height:1.4}
.sentence-card .it mark{background:#FCE9A8;border-radius:4px;padding:0 3px}
.sentence-card .lbl{
  font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:8px;
}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{
  background:var(--card);border:2px solid rgba(25,27,32,.14);border-radius:14px;
  box-shadow:0 2.5px 0 rgba(25,27,32,.14);
  padding:14px 16px;font-size:16px;font-weight:600;text-align:left;
  transition:transform .06s ease;
}
.opt:active{transform:translateY(2px)}
.opt.picked{border-color:var(--blue);background:#EAF1F9}
.opt.right{border-color:var(--green);background:#E5F3EC;box-shadow:0 2.5px 0 var(--green)}
.opt.wrong{border-color:var(--red);background:#FBE9EA;box-shadow:0 2.5px 0 var(--red)}
.opts.duo{flex-direction:row}
.opts.duo .opt{flex:1;text-align:center;font-family:var(--disp);font-weight:900;font-size:18px;padding:20px 10px}
.opt .sub{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-top:3px;font-family:var(--body)}

.feedback{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:16px 20px calc(18px + env(safe-area-inset-bottom));
}
.feedback .inner{max-width:520px;margin:0 auto}
.feedback.ok{background:#D9EEE3}
.feedback.bad{background:#F8DCDE}
.feedback h3{font-family:var(--disp);font-weight:900;font-size:18px}
.feedback.ok h3{color:var(--green-dark)}
.feedback.bad h3{color:var(--red-dark)}
.feedback p{font-size:14px;line-height:1.45;margin-top:4px;color:var(--ink)}
.feedback .btn{margin-top:12px}
.feedback.ok .btn{background:var(--green);box-shadow:0 3px 0 var(--green-dark);color:#fff}
.feedback.bad .btn{background:var(--red);box-shadow:0 3px 0 var(--red-dark);color:#fff}
.check-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:55;
  padding:14px 20px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,transparent);
}
.check-bar .btn{max-width:520px;margin:0 auto}
.btn.disabled{opacity:.4;pointer-events:none}
.ex-spacer{height:130px}

/* ============ COMPLETE ============ */
#screen-done{
  max-width:560px;margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px;text-align:center;
}
.done-sign{
  font-family:var(--disp);font-weight:900;color:#fff;background:var(--green);
  border-radius:14px;padding:26px 34px;font-size:26px;
  border:3px solid #fff;outline:3px solid var(--green);
  box-shadow:0 5px 0 var(--green-dark);
  transform:rotate(-2deg);
}
#screen-done h2{font-family:var(--disp);font-weight:900;font-size:24px;margin-top:26px;letter-spacing:-.02em}
.done-stats{display:flex;gap:12px;margin-top:20px;width:100%;max-width:340px}
.done-stat{
  flex:1;background:var(--card);border-radius:14px;padding:14px 8px;
  border:1.5px solid rgba(25,27,32,.12);box-shadow:var(--shadow);
}
.done-stat b{display:block;font-family:var(--disp);font-weight:900;font-size:22px}
.done-stat span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft)}
.done-stat.c-xp b{color:var(--blue)}
.done-stat.c-acc b{color:var(--green)}
.done-stat.c-str b{color:#E2560E}
#screen-done .btn{max-width:340px}

.tipline{
  margin:14px 20px 0;padding:12px 14px;border-radius:12px;
  background:#FFF7E0;border:1.5px solid #F0D98C;font-size:13.5px;line-height:1.45;
}
.tipline b{font-family:var(--disp)}
</style>
</head>
<body>

<header>
  <div class="brand">PATENTE <span>PAROLE</span></div>
  <div class="stats">
    <div class="stat streak" title="Day streak">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2s.7 2.6-1.2 5C10.5 9.3 8 10.5 8 14a4.5 4.5 0 0 0 9 0c0-1.2-.4-2.2-1-3 0 0-.3 1.5-1.5 2 .4-2.7-.6-6.3-1-11z"/><path d="M12 22a7 7 0 0 1-7-7c0-3 1.6-4.9 3-6.5-.2 1.6 0 3 .8 4C9.4 9.7 11 7.4 11 4c3 2 6 6.3 6 10a7 7 0 0 1-5 8z" opacity=".35"/></svg>
      <span id="stat-streak">0</span>
    </div>
    <div class="stat xp" title="Total XP">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
      <span id="stat-xp">0</span>
    </div>
  </div>
</header>

<!-- ================= MAP ================= -->
<main id="screen-map">
  <div class="map-intro">
    <h1>La strada per la patente</h1>
    <p>Master the ~80 words that decide VERO or FALSO. Tap a sign to start a 10-question lesson. Words you miss come back until they stick.</p>
  </div>
  <div id="tip" class="tipline"></div>
  <div class="road-wrap">
    <div class="road"></div>
    <div class="units" id="units"></div>
  </div>
</main>

<!-- ================= LESSON ================= -->
<main id="screen-lesson" class="hidden">
  <div class="lesson-top">
    <button class="close" id="btn-quit" aria-label="Quit lesson">✕</button>
    <div class="progress"><i id="prog"></i></div>
    <div class="hearts" id="hearts"></div>
  </div>
  <div class="ex-area" id="ex-area"></div>
</main>

<!-- ================= DONE ================= -->
<main id="screen-done" class="hidden">
  <div class="done-sign" id="done-sign">LEZIONE COMPLETATA</div>
  <h2 id="done-msg"></h2>
  <div class="done-stats">
    <div class="done-stat c-xp"><b id="done-xp">0</b><span>XP earned</span></div>
    <div class="done-stat c-acc"><b id="done-acc">0%</b><span>Accuracy</span></div>
    <div class="done-stat c-str"><b id="done-streak">0</b><span>Day streak</span></div>
  </div>
  <button class="btn btn-blue" id="btn-continue" style="margin-top:26px">Back to the road</button>
</main>

<script>
"use strict";
/* ================================================================
   DATA — the high-value exam vocabulary, organised into units.
   cls: "trap"   = absolute words that usually mark a FALSO statement
        "safe"   = exception/qualifier words that usually mark a VERO
================================================================ */
const UNITS = [
{
  id:"trap", title:"Parole Trappola", sub:"Trap words", sign:"triangle", glyph:"!",
  desc:"Absolute words. When a statement says always, never, only, all — it is very often FALSO.",
  words:[
    {it:"sempre", en:"always", cls:"trap"},
    {it:"mai", en:"never", cls:"trap"},
    {it:"solo", en:"only", cls:"trap"},
    {it:"soltanto", en:"only / solely", cls:"trap"},
    {it:"tutti", en:"all / everyone", cls:"trap"},
    {it:"nessuno", en:"no one / none", cls:"trap"},
    {it:"ogni", en:"every", cls:"trap"},
    {it:"qualsiasi", en:"any / whatever", cls:"trap"},
    {it:"esclusivamente", en:"exclusively", cls:"trap"},
    {it:"in ogni caso", en:"in any case", cls:"trap"},
    {it:"comunque", en:"in any case / anyway", cls:"trap"},
    {it:"indifferentemente", en:"either way / indifferently", cls:"trap"},
    {it:"limitatamente", en:"only / limited to", cls:"trap"},
  ],
  sentences:[
    {it:"E' <mark>sempre</mark> consentito superare un veicolo a due ruote", en:"It is always permitted to overtake a two-wheeled vehicle", ans:false,
     why:"\u201cSempre\u201d + a permission = classic trap. Overtaking is never allowed \u201calways\u201d — it depends on conditions. FALSO."},
    {it:"La sosta e la fermata sono <mark>sempre</mark> vietate sugli attraversamenti pedonali", en:"Parking and stopping are always prohibited on pedestrian crossings", ans:true,
     why:"Careful! \u201cSempre\u201d + a prohibition on something obviously dangerous is often VERO. The trap-word rule is a hint, not a law."},
    {it:"In autostrada si può sorpassare <mark>indifferentemente</mark> a destra e a sinistra", en:"On the motorway you can overtake on the right or left indifferently", ans:false,
     why:"\u201cIndifferentemente\u201d (either way, no rule) almost always marks a FALSO. You overtake on the left."},
    {it:"La fermata è vietata <mark>limitatamente</mark> alle ore di esercizio, in corrispondenza dei distributori di carburante", en:"Stopping is prohibited only during operating hours, near fuel stations", ans:false,
     why:"\u201cLimitatamente\u201d = \u201conly\u201d in disguise. Restricting a rule that is actually broader → FALSO."},
  ]
},
{
  id:"safe", title:"Salvagenti", sub:"Exception words", sign:"circle-blue", glyph:"S",
  desc:"Qualifier words that add nuance — salvo, purché, tranne. Statements with these are often VERO (but watch purché in permissions!).",
  words:[
    {it:"salvo", en:"except / unless", cls:"safe"},
    {it:"tranne", en:"except", cls:"safe"},
    {it:"purché", en:"provided that", cls:"safe"},
    {it:"a meno che", en:"unless", cls:"safe"},
    {it:"qualora", en:"if / in case", cls:"safe"},
    {it:"eccetto", en:"except", cls:"safe"},
    {it:"anche", en:"also / even", cls:"safe"},
    {it:"almeno", en:"at least", cls:"safe"},
    {it:"di norma", en:"as a rule", cls:"safe"},
    {it:"in genere", en:"generally", cls:"safe"},
    {it:"se possibile", en:"if possible", cls:"safe"},
    {it:"talvolta", en:"sometimes", cls:"safe"},
  ],
  sentences:[
    {it:"La sosta è vietata sulle banchine, <mark>salvo</mark> diversa segnalazione", en:"Parking is prohibited on the shoulders, unless otherwise indicated", ans:true,
     why:"\u201cSalvo diversa segnalazione\u201d (unless signs say otherwise) is how real rules are written. VERO."},
    {it:"La fermata è consentita sulle corsie di accelerazione, <mark>purché</mark> brevissima", en:"Stopping is permitted on acceleration lanes, provided it is very brief", ans:false,
     why:"The big exception to the rule: \u201cpurché\u201d used to soften a forbidden action is a trap. Stopping on acceleration lanes is never OK. FALSO."},
    {it:"E' consentito il sorpasso sulle intersezioni <mark>purché</mark> non provenga nessuno dalla destra", en:"Overtaking is permitted at intersections provided no one comes from the right", ans:false,
     why:"Same trap: \u201cpurché\u201d cannot make a forbidden manoeuvre legal. Overtaking at intersections is prohibited. FALSO."},
    {it:"E' consentito sorpassare un'auto della Polizia, <mark>se</mark> non è in servizio di emergenza e non vi sono altri tipi di impedimenti", en:"It is permitted to overtake a police car if it is not on emergency duty and there are no other impediments", ans:true,
     why:"A reasonable condition on a normal action → VERO. Police cars are ordinary traffic when not on duty."},
  ]
},
{
  id:"verbs", title:"Verbi Chiave", sub:"Key verbs", sign:"circle", glyph:"V",
  desc:"Every question hinges on one of these: prohibited, permitted, obligatory, must, may.",
  words:[
    {it:"è vietato", en:"it is prohibited"},
    {it:"è consentito", en:"it is permitted"},
    {it:"è obbligatorio", en:"it is obligatory"},
    {it:"deve", en:"must"},
    {it:"può", en:"can / may"},
    {it:"occorre", en:"it is necessary"},
    {it:"bisogna", en:"one must"},
    {it:"comporta", en:"entails / involves"},
    {it:"consente", en:"allows"},
    {it:"vieta", en:"prohibits"},
    {it:"prescrive", en:"prescribes / requires"},
    {it:"preavvisa", en:"gives advance warning of"},
    {it:"indica", en:"indicates"},
  ],
  sentences:[
    {it:"Il segnale DIVIETO DI SOSTA <mark>vieta</mark> la sosta ma <mark>consente</mark> la fermata", en:"The NO PARKING sign prohibits parking but allows brief stopping", ans:true,
     why:"Divieto di sosta bans sosta (parking) only. Fermata (a brief stop) stays legal. Know the vieta/consente pair."},
    {it:"E' <mark>vietato</mark> il sorpasso nelle strade a senso unico", en:"Overtaking is prohibited on one-way streets", ans:false,
     why:"Nothing forbids overtaking on one-way streets. A made-up prohibition → FALSO."},
  ]
},
{
  id:"road", title:"La Strada", sub:"Road anatomy", sign:"square", glyph:"⇉",
  desc:"The parts of the road. Carreggiata vs corsia vs banchina trips everyone up.",
  words:[
    {it:"la carreggiata", en:"the roadway (whole driving surface)"},
    {it:"la corsia", en:"the lane"},
    {it:"la banchina", en:"the shoulder / verge"},
    {it:"il marciapiede", en:"the sidewalk"},
    {it:"l'incrocio", en:"the crossroads"},
    {it:"l'intersezione", en:"the intersection"},
    {it:"l'attraversamento pedonale", en:"the pedestrian crossing"},
    {it:"il passaggio a livello", en:"the level crossing"},

/* ================================================================
   STATE + SAFE STORAGE (localStorage works on GitHub Pages; the
   try/catch keeps the app alive in sandboxed previews)
================================================================ */
const KEY="pdg_duo";
function load(){ try{const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){} return null; }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
let S = load() || { xp:0, streak:0, lastDay:"", strength:{}, unitLessons:{} };

function wid(u,w){ return u.id+"|"+w.it; }
function strengthOf(u,w){ return S.strength[wid(u,w)]||0; }

/* ================================================================
   TIPS ROTATION
================================================================ */
const TIPS=[
  "<b>Golden rule:</b> a trap word (sempre, mai, solo) doesn't guarantee FALSO — it means <i>slow down and check</i>.",
  "<b>Purché trap:</b> \u201cprovided that\u201d can never legalise a forbidden manoeuvre. \u201cÈ consentito X purché...\u201d about a banned X = FALSO.",
  "<b>Sosta vs fermata:</b> sosta = you leave the car. Fermata = brief stop, you stay. Divieto di sosta still allows fermata.",
  "<b>Salvo diversa segnalazione</b> = \u201cunless signs say otherwise\u201d. Rules written this way are usually VERO.",
  "<b>Negations flip everything.</b> Read \u201cnon\u201d twice. Missing a \u201cnon\u201d is the #1 way to lose a point.",
];
document.getElementById("tip").innerHTML = TIPS[Math.floor(Math.random()*TIPS.length)];

/* ================================================================
   MAP RENDERING
================================================================ */
const $=s=>document.querySelector(s);
function unitMastery(u){
  if(!u.words.length) return 0;
  const max=u.words.length*3;
  let got=0; u.words.forEach(w=>got+=Math.min(3,strengthOf(u,w)));
  return got/max;
}
function renderHeader(){
  $("#stat-xp").textContent=S.xp;
  $("#stat-streak").textContent=S.streak;
}
function renderMap(){
  renderHeader();
  const box=$("#units"); box.innerHTML="";
  UNITS.forEach((u,i)=>{
    const m=unitMastery(u);
    const prevDone = i===0 || (S.unitLessons[UNITS[i-1].id]||0)>=1;
    const row=document.createElement("div"); row.className="unit-row";
    const node=document.createElement("button");
    node.className="unit-node"+(prevDone?"":" locked");
    node.innerHTML=`
      <div class="sign ${u.sign}"><span class="glyph">${m>=1?"✓":u.glyph}</span></div>
      <div class="unit-label">
        <small>${u.sub}</small>
        <b>${u.title}</b>
        <div class="unit-bar"><i style="width:${Math.round(m*100)}%"></i></div>
      </div>`;
    node.onclick=()=>openUnit(u);
    row.appendChild(node); box.appendChild(row);
  });
}

/* ================================================================
   UNIT SHEET
================================================================ */
function openUnit(u){
  const ov=document.createElement("div"); ov.className="overlay";
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  const chips=u.words.map(w=>{
    const s=strengthOf(u,w);
    const cls=s>=3?"s2":(s>=1?"s1":"s0");
    return `<span class="chip ${cls}">${w.it} <i>· ${w.en}</i></span>`;
  }).join("");
  ov.innerHTML=`<div class="sheet">
    <div class="sheet-head">
      <div class="sign ${u.sign}"><span class="glyph">${u.glyph}</span></div>
      <div><h2>${u.title}</h2><p>${u.desc}</p></div>
    </div>
    <div class="word-grid">${chips}</div>
    <button class="btn btn-blue" id="sheet-start">Start lesson · +2 XP per answer</button>
    <button class="btn btn-ghost" id="sheet-close">Close</button>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector("#sheet-start").onclick=()=>{ ov.remove(); startLesson(u); };
  ov.querySelector("#sheet-close").onclick=()=>ov.remove();
}

/* ================================================================
   LESSON ENGINE
================================================================ */
let L=null; // {unit, queue, total, hearts, correct, wrong, xp}
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const pick=(a,n)=>shuffle(a).slice(0,n);

function buildExercises(u){
  // weakest words first
  const words=[...u.words].sort((a,b)=>strengthOf(u,a)-strengthOf(u,b));
  const chosen=words.slice(0,7);
  const ex=[];
  chosen.forEach((w,i)=>{
    if(w.cls && Math.random()<0.35){
      ex.push({t:"classify", w, u});
    } else if(i%2===0){
      ex.push({t:"it_en", w, u});
    } else {
      ex.push({t:"en_it", w, u});
    }
  });
  // sentence drills: up to 3, pulled from this unit (fall back to trap/safe pool)
  let pool=u.sentences.length?u.sentences:UNITS[0].sentences.concat(UNITS[1].sentences);
  pick(pool,Math.min(3,pool.length)).forEach(s=>ex.push({t:"vf", s, u}));
  return shuffle(ex).slice(0,10);
}

function distractors(u,w,field){
  // options from same unit first, then anywhere
  let opts=u.words.filter(x=>x!==w).map(x=>x[field]);
  if(opts.length<3){
    UNITS.forEach(o=>o.words.forEach(x=>{ if(x!==w) opts.push(x[field]); }));
  }
  return pick([...new Set(opts)],3);
}

function startLesson(u){
  L={unit:u, queue:buildExercises(u), total:0, done:0, hearts:3, correct:0, wrong:0, xp:0};
  L.total=L.queue.length;
  $("#screen-map").classList.add("hidden");
  $("#screen-done").classList.add("hidden");
  $("#screen-lesson").classList.remove("hidden");
  window.scrollTo(0,0);
  nextEx();
}
$("#btn-quit").onclick=()=>{ if(confirm("Quit this lesson? Progress in it will be lost.")) showMap(); };
function showMap(){
  $("#screen-lesson").classList.add("hidden");
  $("#screen-done").classList.add("hidden");
  $("#screen-map").classList.remove("hidden");
  renderMap();
}
function renderHearts(){
  $("#hearts").innerHTML=[0,1,2].map(i=>`<span class="${i<L.hearts?"":"off"}">❤️</span>`).join("");
}
function renderProg(){
  $("#prog").style.width=Math.round(100*L.done/Math.max(L.total,1))+"%";
}

function nextEx(){
  removeBars();
  if(!L.queue.length){ finishLesson(); return; }
  renderHearts(); renderProg();
  const e=L.queue[0];
  const area=$("#ex-area");
  if(e.t==="it_en"){
    area.innerHTML=`
      <div class="ex-kind">What does this mean?</div>
      <div class="prompt-sign">${e.w.it}<small>Italiano</small></div>
      <div class="opts" id="opts"></div><div class="ex-spacer"></div>`;
    mountMC(e, shuffle([e.w.en,...distractors(e.u,e.w,"en")]), e.w.en);
  }
  else if(e.t==="en_it"){
    area.innerHTML=`
      <div class="ex-kind">Pick the Italian</div>
      <div class="prompt-en">“${e.w.en}”</div>
      <div class="opts" id="opts"></div><div class="ex-spacer"></div>`;
    mountMC(e, shuffle([e.w.it,...distractors(e.u,e.w,"it")]), e.w.it);
  }
  else if(e.t==="classify"){
    area.innerHTML=`
      <div class="ex-kind">Trap word or exception word?</div>
      <div class="prompt-sign">${e.w.it}<small>${e.w.en}</small></div>
      <div class="opts duo" id="opts">
        <button class="opt" data-v="trap">⚠️ TRAPPOLA<span class="sub">absolute — smells like FALSO</span></button>
        <button class="opt" data-v="safe">🟢 SALVAGENTE<span class="sub">qualifier — often VERO</span></button>
      </div><div class="ex-spacer"></div>`;
    mountPick(e, b=>b.dataset.v===e.w.cls,
      e.w.cls==="trap"
        ? `“${e.w.it}” is an absolute — when it makes a rule bigger than life, suspect FALSO.`
        : `“${e.w.it}” adds a condition or exception — the texture of real rules, often VERO.`);
  }
  else if(e.t==="vf"){
    area.innerHTML=`
      <div class="ex-kind">Real exam pattern — VERO o FALSO?</div>
      <div class="sentence-card">
        <div class="lbl">Domanda</div>
        <div class="it">${e.s.it}</div>
      </div>
      <div class="opts duo" id="opts">
        <button class="opt" data-v="true">VERO</button>
        <button class="opt" data-v="false">FALSO</button>
      </div><div class="ex-spacer"></div>`;
    mountPick(e, b=>(b.dataset.v==="true")===e.s.ans, e.s.why, e.s.en);
  }
  window.scrollTo(0,0);
}

/* multiple-choice with a Check button */
function mountMC(e, options, right){
  const box=$("#opts");
  options.forEach(o=>{
    const b=document.createElement("button");
    b.className="opt"; b.textContent=o;
    b.onclick=()=>{ box.querySelectorAll(".opt").forEach(x=>x.classList.remove("picked")); b.classList.add("picked"); enableCheck(); };
    box.appendChild(b);
  });
  showCheck(()=>{
    const picked=box.querySelector(".picked");
    const ok=picked.textContent===right;
    box.querySelectorAll(".opt").forEach(x=>{
      if(x.textContent===right)x.classList.add("right");
      else if(x===picked&&!ok)x.classList.add("wrong");
      x.disabled=true;
    });
    grade(e, ok, ok?null:`Correct answer: ${right}`);
  });
}
/* instant two-button pick (classify / VF) */
function mountPick(e, isRight, why, enText){
  const box=$("#opts");
  box.querySelectorAll(".opt").forEach(b=>{
    b.onclick=()=>{
      const ok=isRight(b);
      box.querySelectorAll(".opt").forEach(x=>{
        if(isRight(x))x.classList.add("right");
        else if(x===b&&!ok)x.classList.add("wrong");
        x.disabled=true;
      });
      let msg=why||"";
      if(enText) msg=`<i>${enText}</i><br><br>`+msg;
      grade(e, ok, msg, true);
    };
  });
}

let checkFn=null;
function showCheck(fn){
  removeBars();
  checkFn=fn;
  const bar=document.createElement("div");
  bar.className="check-bar"; bar.id="check-bar";
  bar.innerHTML=`<button class="btn btn-blue disabled" id="btn-check">CHECK</button>`;
  document.body.appendChild(bar);
  $("#btn-check").onclick=()=>{ if(checkFn){const f=checkFn; checkFn=null; f();} };
}
function enableCheck(){ const b=$("#btn-check"); if(b)b.classList.remove("disabled"); }
function removeBars(){
  const c=document.getElementById("check-bar"); if(c)c.remove();
  const f=document.getElementById("fb"); if(f)f.remove();
}

function grade(e, ok, extra, isHTML){
  const c=document.getElementById("check-bar"); if(c)c.remove();
  const item=L.queue.shift();
  if(ok){
    L.correct++; L.xp+=2; L.done++;
    if(item.w){ const k=wid(item.u,item.w); S.strength[k]=Math.min(5,(S.strength[k]||0)+1); }
  }else{
    L.wrong++; L.hearts=Math.max(0,L.hearts-1);
    if(item.w){ const k=wid(item.u,item.w); S.strength[k]=Math.max(0,(S.strength[k]||0)-1); }
    L.queue.push(item); L.total++;      // it comes back
  }
  renderHearts(); renderProg(); save();
  const fb=document.createElement("div");
  fb.className="feedback "+(ok?"ok":"bad"); fb.id="fb";
  const title= ok? pick(["Esatto!","Bravissimo!","Perfetto!","Giusto!"],1)[0] : "Not quite — it'll come back";
  const body = extra ? (isHTML?extra:extra) : "";
  fb.innerHTML=`<div class="inner"><h3>${title}</h3>${body?`<p>${body}</p>`:""}<button class="btn" id="btn-next">CONTINUE</button></div>`;
  document.body.appendChild(fb);
  $("#btn-next").onclick=()=>{
    if(L.hearts===0){ heartsOut(); } else { nextEx(); }
  };
}

function heartsOut(){
  removeBars();
  const area=$("#ex-area");
  area.innerHTML=`
    <div style="text-align:center;margin-top:60px">
      <div style="font-size:52px">💔</div>
      <h2 style="font-family:var(--disp);font-weight:900;font-size:22px;margin-top:14px">Out of hearts</h2>
      <p style="color:var(--ink-soft);margin-top:8px;font-size:14.5px">No problem — the words you missed are now weaker in the queue, so the next lesson will drill exactly those.</p>
      <button class="btn btn-blue" style="max-width:300px;margin:26px auto 0" onclick="showMap()">Back to the road</button>
    </div>`;
}

function today(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function yesterday(){ const d=new Date(Date.now()-864e5); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

function finishLesson(){
  removeBars();
  const t=today();
  if(S.lastDay!==t){
    S.streak = (S.lastDay===yesterday()) ? S.streak+1 : 1;
    S.lastDay=t;
  }
  const bonus=10; S.xp+=L.xp+bonus;
  S.unitLessons[L.unit.id]=(S.unitLessons[L.unit.id]||0)+1;
  save();
  const acc=L.correct+L.wrong===0?100:Math.round(100*L.correct/(L.correct+L.wrong));
  $("#screen-lesson").classList.add("hidden");
  $("#screen-done").classList.remove("hidden");
  $("#done-msg").textContent = acc===100 ? "Percorso netto — no mistakes!" :
    acc>=70 ? "Solid run. Missed words will come back stronger." :
    "Tough one — those words are now first in line next lesson.";
  $("#done-xp").textContent="+"+(L.xp+bonus);
  $("#done-acc").textContent=acc+"%";
  $("#done-streak").textContent=S.streak;
  renderHeader();
  window.scrollTo(0,0);
}
$("#btn-continue").onclick=showMap;

renderMap();
</script>
